name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff==0.6.9
      - name: ruff check
        working-directory: app
        run: ruff check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libpq-dev libjpeg-dev zlib1g-dev libmagic1
      - run: pip install -r requirements.txt mypy==1.11.2
      - name: mypy
        working-directory: app
        run: mypy --ignore-missing-imports --exclude 'migrations/' users documents app

  test:
    name: Tests (pytest + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: securevault_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret — ephemeral CI Postgres, no real data
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME: securevault_db
      DB_USER: postgres
      DB_PASS: postgres  # pragma: allowlist secret — matches the ephemeral CI Postgres above
      DB_HOST: localhost
      DB_PORT: 5432
      DEBUG: 'True'
      SECRET_KEY: ci-test-secret-key-not-for-production  # pragma: allowlist secret
      ALLOWED_HOSTS: localhost,127.0.0.1
      # Clé Fernet valide mais jetable — sert uniquement aux tests CI, aucune
      # donnée réelle n'existe dans ce contexte.
      VAULT_ENCRYPTION_KEY: C0REAiJuPpvw9qqJ8rjS0XTk60EzGR0ZdAj1jKv0RWM=  # pragma: allowlist secret
      MAX_UPLOAD_SIZE: '10485760'
      ALLOWED_FILE_EXTENSIONS: pdf,docx,xlsx,txt,png,jpg,jpeg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libpq-dev libjpeg-dev zlib1g-dev libmagic1
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: app
        run: pytest
